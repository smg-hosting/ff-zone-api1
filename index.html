<!DOCTYPE html>

    <style>
        :root {
            --bg-main: #050a14;
            --bg-card: rgba(20, 30, 48, 0.6);
            --accent: #00e676;
            --accent-2: #00b0ff;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-main);
            color: #fff;
            overflow-x: hidden;
        }
        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-accent {
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
        }
        .btn-3d {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(0);
        }
        .btn-3d:active {
            transform: translateY(2px) scale(0.98);
        }
        .card-3d {
            transform: perspective(1000px);
            transition: transform 0.3s ease;
        }
        .card-3d:hover {
            transform: perspective(1000px) rotateX(2deg) rotateY(-2deg) scale(1.02);
        }
        .page-transition {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 0px; }
        .nav-active { color: var(--accent); }
        .lang-toggle { position: relative; width: 44px; height: 24px; background: #333; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .lang-toggle.on { background: var(--accent); }
        .lang-toggle::after { content: ''; position: absolute; width: 18px; height: 18px; background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: 0.3s; }
        .lang-toggle.on::after { transform: translateX(20px); }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid var(--accent);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>

    <script>
        // ========================================================
        // GLOBAL STATE & CONFIG
        // ========================================================
        let currentUserData = null;
        
        const translations = {
            en: { home: "Home", wallet: "Wallet", tasks: "Tasks", profile: "Profile", balance: "Balance" },
            bn: { home: "হোম", wallet: "ওয়ালেট", tasks: "টাস্ক", profile: "প্রোফাইল", balance: "ব্যালেন্স" }
        };

        // ========================================================
        // FIREBASE INIT
        // ========================================================
        firebase.initializeApp(FIREBASE_CONFIG);
        const db = firebase.database();

        // Telegram SDK Init
        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        // ========================================================
        // TELEGRAM AUTO-AUTHENTICATION LOGIC
        // ========================================================
        async function initTelegramAuth() {
            if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe.user) {
                const tgUser = Telegram.WebApp.initDataUnsafe.user;
                const userRef = db.ref('users/' + tgUser.id);
                
                try {
                    const snap = await userRef.get();
                    
                    if (!snap.exists()) {
                        // Create New User Profile from Telegram Data
                        const newUserData = {
                            telegramId: tgUser.id,
                            firstName: tgUser.first_name || "User",
                            lastName: tgUser.last_name || "",
                            username: tgUser.username || "",
                            photoURL: tgUser.photo_url || "https://via.placeholder.com/150",
                            authMethod: "telegram",
                            balance: 0,
                            coins: 0,
                            referralCode: generateRefCode(),
                            referredBy: Telegram.WebApp.initDataUnsafe.start_param || "",
                            joinDate: Date.now(),
                            lastLogin: Date.now(),
                            accountStatus: "active",
                            language: "en"
                        };
                        await userRef.set(newUserData);
                        currentUserData = newUserData;
                    } else {
                        currentUserData = snap.val();
                        // Update last login
                        await userRef.update({ lastLogin: Date.now() });
                    }

                    // Check Admin Status
                    const adminSnap = await db.ref('admin/admins/' + tgUser.id).get();
                    if (adminSnap.exists() && adminSnap.val().enabled) {
                        showApp('admin');
                        showAdminPage('dashboard');
                    } else {
                        showApp('user');
                        showPage('home');
                    }
                } catch (error) {
                    showToast(error.message, "error");
                }
            } else {
                // Not opened inside Telegram
                document.getElementById('auth-loader').classList.add('hidden');
                document.getElementById('auth-error').classList.remove('hidden');
            }
        }

        function logout() {
            // Mini Apps usually don't logout, but we can reset state
            currentUserData = null;
            showApp('auth');
            document.getElementById('auth-loader').classList.remove('hidden');
            document.getElementById('auth-error').classList.add('hidden');
        }

        // ========================================================
        // NAVIGATION & UI
        // ========================================================
        function showApp(appName) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('user-app').classList.add('hidden');
            document.getElementById('admin-app').classList.add('hidden');
            document.getElementById(appName).classList.remove('hidden');
            lucide.createIcons();
        }

        function showPage(pageId) {
            const content = document.getElementById('user-content');
            content.classList.add('page-transition');
            setTimeout(() => content.classList.remove('page-transition'), 400);

            // Update Header
            if (currentUserData) {
                document.getElementById('user-name').innerText = currentUserData.firstName + " " + (currentUserData.lastName || "");
                document.getElementById('user-balance').innerText = `৳ ${currentUserData.balance.toFixed(2)}`;
                document.getElementById('user-avatar').src = currentUserData.photoURL;
            }

            // Route Mapping
            const routes = {
                home: renderHome,
                perks: renderPerks,
                play: renderPlay,
                arena: renderArena,
                explore: renderExplore,
                profile: renderProfile,
                wallet: renderWallet,
                withdraw: renderWithdraw,
                tasks: renderTasks
            };
            
            content.innerHTML = routes[pageId] ? routes[pageId]() : "<h1>404 Not Found</h1>";
            lucide.createIcons();
        }

        function showAdminPage(pageId) {
            const content = document.getElementById('admin-content');
            content.classList.add('page-transition');
            setTimeout(() => content.classList.remove('page-transition'), 400);

            const routes = {
                dashboard: renderAdminDashboard,
                'all-users': renderAdminUsers,
                withdrawals: renderAdminWithdrawals
            };
            
            content.innerHTML = routes[pageId] ? routes[pageId]() : "<h1>Select an option</h1>";
            lucide.createIcons();
        }

        function toggleDropdown(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function toggleAdminDrawer() {
            const drawer = document.getElementById('admin-drawer');
            drawer.classList.toggle('-translate-x-full');
            drawer.classList.toggle('translate-x-0');
        }

        // ========================================================
        // USER APP PAGES
        // ========================================================
        function renderHome() {

                        <div class="flex gap-2 mt-4">
                            <button onclick="showPage('withdraw')" class="btn-3d flex-1 py-3 rounded-xl bg-white/10 hover:bg-white/20">Withdraw</button>
                            <button onclick="showPage('tasks')" class="btn-3d flex-1 py-3 rounded-xl bg-green-500 text-black font-semibold">Earn</button>

                            <p class="text-xs text-gray-400">Coins</p>

                        <div class="glass p-4 rounded-2xl flex flex-col items-center card-3d">

                            <p class="text-2xl font-bold">0</p>
                            <p class="text-xs text-gray-400">Referrals</p>
                        </div>
                    </div>

                    <div class="glass p-4 rounded-2xl">
                        <h3 class="font-bold mb-3">Quick Tasks</h3>
                        <div class="space-y-2">
                            <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl">
                                <div class="flex items-center gap-3">

        function renderProfile() {

                <div class="space-y-3">
                    <!-- Earning & Wallet -->

        function renderAdminDashboard() {
            return `

        function renderAdminUsers() {
            return `<div class="glass p-6 rounded-2xl"><h2 class="text-xl mb-4">All Users</h2><p>User list goes here...</p></div>`;
        }

        function renderAdminWithdrawals() {
            return `<div class="glass p-6 rounded-2xl"><h2 class="text-xl mb-4">Pending Withdrawals</h2><p>Withdrawal list goes here...</p></div>`;
        }

        // ========================================================
        // UTILITIES
        // ========================================================
        function openModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal-container').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }
        function showToast(msg, type="success") {
            const t = document.createElement('div');
            t.className = `glass px-4 py-3 rounded-xl flex items-center gap-2 ${type === 'success' ? 'border-green-500' : 'border-red-500'}`;
            t.innerHTML = `<span>${msg}</span>`;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
        function toggleLang(el) {
            document.querySelectorAll('.lang-toggle').forEach(t => t.classList.remove('on'));
            el.classList.add('on');
        }
        function generateRefCode() {
            return 'REF' + Math.random().toString(36).substr(2, 6).toUpperCase();
        }

        // ========================================================
        // INITIALIZATION
        // ========================================================
        // Start authentication check on load
        initTelegramAuth();
        lucide.createIcons();
    </script>
